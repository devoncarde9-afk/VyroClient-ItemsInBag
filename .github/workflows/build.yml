name: Build VyroClient Addon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
    - name: Install iOS SDK
      run: |
        cd $HOME/theos
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/iPhoneOS*.sdk sdks/
        
    - name: Verify files
      run: |
        echo "=== Repository contents ==="
        ls -la
        echo ""
        echo "=== Makefile check ==="
        if [ -f Makefile ]; then
          echo "✅ Makefile found"
          cat Makefile
        else
          echo "❌ Makefile NOT found"
        fi
        echo ""
        echo "=== .x file check ==="
        if [ -f VyroClient_ItemsInBag_Addon.x ]; then
          echo "✅ .x file found"
        else
          echo "❌ .x file NOT found"
        fi
        
    - name: Build tweak
      run: |
        export THEOS=$HOME/theos
        export THEOS_MAKE_PATH=$HOME/theos/makefiles
        make clean || true
        make package FINALPACKAGE=1
        
    - name: Check build output
      run: |
        echo "=== Build output ==="
        ls -la
        if [ -d packages ]; then
          echo "✅ packages directory found"
          ls -la packages/
        else
          echo "❌ packages directory NOT found"
        fi
        
    - name: Upload compiled deb
      uses: actions/upload-artifact@v4
      with:
        name: VyroClient_ItemsInBag_Compiled
        path: packages/*.deb
