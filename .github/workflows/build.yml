name: Build VyroClient Addon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        export THEOS=$HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
    - name: Install iOS SDK
      run: |
        cd $HOME/theos
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/iPhoneOS*.sdk sdks/
        
    - name: Setup build environment
      run: |
        export THEOS=$HOME/theos
        export THEOS_DEVICE_IP=localhost
        export THEOS_DEVICE_PORT=22
        
    - name: Compile tweak manually
      run: |
        export THEOS=$HOME/theos
        
        # Process .x file with logos
        $THEOS/bin/logos.pl VyroClient_ItemsInBag_Addon.x > VyroClient_ItemsInBag_Addon.m
        
        # Compile to object file
        xcrun -sdk iphoneos clang -arch arm64 \
          -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=14.0 \
          -fobjc-arc \
          -I$THEOS/include \
          -I$THEOS/vendor/include \
          -c VyroClient_ItemsInBag_Addon.m \
          -o VyroClient_ItemsInBag_Addon.o
        
        # Link to dylib
        xcrun -sdk iphoneos clang -arch arm64 \
          -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=14.0 \
          -dynamiclib \
          -o VyroClient_ItemsInBag.dylib \
          VyroClient_ItemsInBag_Addon.o \
          -framework Foundation \
          -framework UIKit \
          -lsubstrate
        
        # Sign the dylib
        ldid -S VyroClient_ItemsInBag.dylib
        
        echo "✅ Compilation complete"
        ls -lh VyroClient_ItemsInBag.dylib
        
    - name: Create deb package
      run: |
        mkdir -p package/DEBIAN
        mkdir -p package/Library/MobileSubstrate/DynamicLibraries
        
        # Copy files
        cp VyroClient_ItemsInBag.dylib package/Library/MobileSubstrate/DynamicLibraries/
        cp VyroClient_ItemsInBag_Addon.plist package/Library/MobileSubstrate/DynamicLibraries/
        
        # Create control file
        cat > package/DEBIAN/control << 'CONTROL'
        Package: com.vyro.itemsinbag
        Name: VyroClient Items in Bag
        Version: 1.0.0
        Architecture: iphoneos-arm64
        Description: Adds Items in Bag Spawner to VyroClient
        Maintainer: Anonymous
        Section: Tweaks
        Depends: mobilesubstrate
        CONTROL
        
        # Build deb
        dpkg-deb -b package VyroClient_ItemsInBag_1.0.0.deb
        
        echo "✅ Package created"
        ls -lh VyroClient_ItemsInBag_1.0.0.deb
        
    - name: Upload compiled deb
      uses: actions/upload-artifact@v4
      with:
        name: VyroClient_ItemsInBag_Compiled
        path: VyroClient_ItemsInBag_1.0.0.deb
