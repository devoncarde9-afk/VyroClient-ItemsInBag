name: CompileMod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install tools
      run: |
        brew install ldid dpkg
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
    - name: Install SDK
      run: |
        cd $HOME/theos
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/iPhoneOS*.sdk sdks/
    - name: Stub substrate
      run: |
        cat > $HOME/theos/vendor/include/substrate.h << 'EOF'
        #import <objc/runtime.h>
        #import <objc/message.h>
        typedef const void *MSImageRef;
        MSImageRef MSGetImageByName(const char *file);
        void *MSFindSymbol(MSImageRef image, const char *name);
        void MSHookMessageEx(Class _class, SEL message, IMP hook, IMP *old);
        EOF
        
        cat > /tmp/stubs.m << 'EOF'
        #import <objc/runtime.h>
        #import <objc/message.h>
        void MSHookMessageEx(Class _class, SEL message, IMP hook, IMP *old) {
            Method method = class_getInstanceMethod(_class, message);
            if (old != NULL) *old = (IMP)method_getImplementation(method);
            method_setImplementation(method, hook);
        }
        EOF
        
    - name: Build
      run: |
        export THEOS=$HOME/theos
        XFILE=$(find . -name "*ItemsInBag*.x" | head -n 1)
        $THEOS/bin/logos.pl "$XFILE" > mod.m
        xcrun -sdk iphoneos clang -arch arm64 -isysroot $(xcrun -sdk iphoneos --show-sdk-path) -miphoneos-version-min=14.0 -fobjc-arc -I$THEOS/include -I$THEOS/vendor/include -Wno-everything -c mod.m -o mod.o
        xcrun -sdk iphoneos clang -arch arm64 -isysroot $(xcrun -sdk iphoneos --show-sdk-path) -miphoneos-version-min=14.0 -fobjc-arc -c /tmp/stubs.m -o /tmp/stubs.o
        xcrun -sdk iphoneos clang -arch arm64 -isysroot $(xcrun -sdk iphoneos --show-sdk-path) -dynamiclib -o VyroClient_ItemsInBag.dylib mod.o /tmp/stubs.o -framework Foundation -framework UIKit -framework CoreGraphics -Wl,-undefined,dynamic_lookup
        ldid -S VyroClient_ItemsInBag.dylib
        echo "✅ BUILD SUCCESSFUL!"
        ls -lh VyroClient_ItemsInBag.dylib
        
    - name: Package
      run: |
        mkdir -p pkg/DEBIAN pkg/Library/MobileSubstrate/DynamicLibraries
        cp VyroClient_ItemsInBag.dylib pkg/Library/MobileSubstrate/DynamicLibraries/
        PLIST=$(find . -maxdepth 1 -name "*.plist" | head -n 1)
        if [ -n "$PLIST" ]; then
          cp "$PLIST" pkg/Library/MobileSubstrate/DynamicLibraries/VyroClient_ItemsInBag.plist
        fi
        cat > pkg/DEBIAN/control << 'CTRL'
Package: com.vyro.itemsinbag
Name: VyroClient Items in Bag
Version: 1.0.0
Architecture: iphoneos-arm64
Description: Items in bag spawner addon
Maintainer: You
Section: Tweaks
Depends: mobilesubstrate
CTRL
        dpkg-deb -b pkg VyroClient_ItemsInBag.deb
        echo "✅✅✅ SUCCESS! DOWNLOAD YOUR MOD! ✅✅✅"
        ls -lh VyroClient_ItemsInBag.deb
        
    - uses: actions/upload-artifact@v4
      with:
        name: DOWNLOAD_THIS
        path: VyroClient_ItemsInBag.deb
